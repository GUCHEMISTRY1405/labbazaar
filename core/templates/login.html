<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>ورود | LabBazaar</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;800&display=swap" rel="stylesheet">
<style>
  body{font-family:"Vazirmatn",Tahoma,sans-serif;background:#f7f9fc;margin:0;padding:40px 20px;direction:rtl}
  .card{max-width:420px;margin:0 auto;background:#fff;border-radius:16px;padding:32px 28px;box-shadow:0 8px 24px rgba(12,34,67,.1)}
  h1{margin:0 0 24px;font-size:24px;color:#0c2243}
  h1 b{color:#f08a1c}
  label{display:block;margin-bottom:14px;font-size:14px;color:#0c2243}
  label span{display:block;margin-bottom:6px;font-weight:500}
  input[type=text],input[type=password],input[type=email]{width:100%;padding:10px 12px;border:1.5px solid #dde5f0;border-radius:10px;font:inherit;box-sizing:border-box}
  input:focus{outline:none;border-color:#f08a1c}
  button{width:100%;padding:12px;border:0;border-radius:10px;background:#0c2243;color:#fff;font:inherit;font-weight:500;cursor:pointer;margin-top:8px}
  button:hover{background:#123a73}
  .link{text-align:center;margin-top:18px;font-size:14px;color:#5b6b82}
  .link a{color:#f08a1c;text-decoration:none;font-weight:500}
  .err{background:#fde3e1;color:#9b2118;padding:10px 14px;border-radius:10px;font-size:14px;margin-bottom:16px}
</style>
</head>
<body>
<div class="card">
  <h1><b>LabBazaar</b> | ورود به حساب</h1>
  {% if form.errors %}
    <div class="err">نام کاربری یا رمز عبور اشتباه است.</div>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <label><span>نام کاربری</span>{{ form.username }}</label>
    <label><span>رمز عبور</span>{{ form.password }}</label>
    <button type="submit">ورود</button>
  </form>
  <div class="link">حساب ندارید؟ <a href="{% url 'register' %}">ثبت‌نام کنید</a></div>
  <div class="link"><a href="{% url 'home' %}">بازگشت به صفحه اصلی</a></div>
</div>
</body>
</html>
